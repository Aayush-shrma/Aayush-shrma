<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Aayush Sharma — Backend Python Developer and AI systems builder</title>
  <desc id="desc">Dark banner: navy gradient, faint grid, teal-to-violet accent, and a terminal panel reading whoami and status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.58" stop-color="#11152b"/>
      <stop offset="1" stop-color="#17152f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#8390b8" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="330" rx="24"/></clipPath>
    <clipPath id="bar"><rect x="0" y="326" width="1200" height="4"/></clipPath>
    <style>
      .dot{animation:pulse 2.6s ease-in-out infinite}
      .caret{animation:blink 1.1s steps(1,end) infinite}
      .rule{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.22,1,.36,1) both}
      .orb{animation:drift 16s ease-in-out infinite alternate}
      .shim{animation:shim 7s linear infinite}
      @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes grow{from{transform:scaleX(.15)}to{transform:scaleX(1)}}
      @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-24px,16px)}}
      @keyframes shim{from{transform:translateX(0)}to{transform:translateX(1520px)}}
      @media (prefers-reduced-motion:reduce){.dot,.caret,.rule,.orb,.shim{animation:none}}
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <rect width="1200" height="330" fill="url(#grid)"/>
    <circle class="orb" cx="1060" cy="-20" r="240" fill="url(#orb)"/>
    <circle cx="1090" cy="40" r="140" fill="none" stroke="#a78bfa" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle cx="1090" cy="40" r="108" fill="none" stroke="#60a5fa" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="4 9"/>
    <path d="M840 0L1040 330M900 0L1100 330M960 0L1160 330" stroke="#8b9ac7" stroke-opacity="0.07"/>

    <!-- identity -->
    <rect x="54" y="42" width="215" height="30" rx="15" fill="#17243a" stroke="#33445f"/>
    <circle class="dot" cx="72" cy="57" r="4" fill="#5eead4"/>
    <text x="86" y="62" fill="#bdc8dc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.3">PROFILE / AAYUSH.SHARMA</text>

    <text x="52" y="146" fill="#f4f7ff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="56" font-weight="750" letter-spacing="-1.9">Aayush Sharma</text>
    <rect class="rule" x="54" y="166" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="54" y="204" fill="#c9d4e8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Backend Python Developer</text>
    <text x="54" y="235" fill="#99a8c5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17">AI systems  ·  Retrieval  ·  Open source</text>

    <g transform="translate(54 272)">
      <rect width="104" height="28" rx="7" fill="#16263a" stroke="#31516a"/>
      <text x="52" y="18" text-anchor="middle" fill="#8be9dd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">PYTHON</text>
      <rect x="114" width="112" height="28" rx="7" fill="#1a203c" stroke="#3e4776"/>
      <text x="170" y="18" text-anchor="middle" fill="#a8b9ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">BACKEND</text>
      <rect x="236" width="85" height="28" rx="7" fill="#241d3d" stroke="#57417b"/>
      <text x="278.5" y="18" text-anchor="middle" fill="#d0b5ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">LLMs / RAG</text>
    </g>

    <!-- terminal -->
    <g transform="translate(775 72)">
      <rect width="358" height="190" rx="16" fill="#0a0f1d" fill-opacity="0.92" stroke="#3c4968" stroke-width="1.2"/>
      <path d="M0 42H358" stroke="#2a3550"/>
      <circle cx="20" cy="21" r="4" fill="#fb7185"/><circle cx="36" cy="21" r="4" fill="#fbbf24"/><circle cx="52" cy="21" r="4" fill="#5eead4"/>
      <text x="78" y="25" fill="#7383a7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">workspace / build.py</text>
      <text x="24" y="78" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">&gt; whoami</text>
      <rect class="caret" x="100" y="64" width="8" height="16" fill="#5eead4"/>
      <text x="24" y="106" fill="#b5c1d8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">backend  ·  ai systems</text>
      <text x="24" y="140" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">&gt; status</text>
      <rect x="24" y="152" width="150" height="20" rx="5" fill="#12342f" stroke="#28635a"/>
      <text x="99" y="166" text-anchor="middle" fill="#7ee8d2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">shipping daily-log</text>
      <rect x="182" y="152" width="112" height="20" rx="5" fill="#262144" stroke="#51417e"/>
      <text x="238" y="166" text-anchor="middle" fill="#c5b5ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">open source</text>
    </g>

    <text x="1140" y="302" text-anchor="end" fill="#64718e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2">B.TECH CSE  /  2027</text>

    <g clip-path="url(#bar)">
      <rect x="0" y="326" width="1200" height="4" fill="url(#accent)"/>
      <rect class="shim" x="-260" y="326" width="260" height="4" fill="#ffffff" opacity="0.5"/>
    </g>
  </g>
</svg>
