<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Aayush Sharma — Backend Python Developer and AI Systems Builder</title>
  <desc id="desc">A dark navy developer profile banner with crisp typography, a cyan-to-violet accent, a subtle grid, and a small terminal-inspired panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="0.58" stop-color="#11152b"/><stop offset="1" stop-color="#17152f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5eead4"/><stop offset="0.52" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4" stop-opacity="0.9"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0.1"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8390b8" stroke-opacity="0.10" stroke-width="1"/></pattern>
    <clipPath id="clip"><rect width="1200" height="330" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <rect width="1200" height="330" fill="url(#grid)"/>
    <circle cx="1070" cy="-15" r="225" fill="url(#orb)" opacity="0.14"/>
    <circle cx="1090" cy="40" r="140" fill="none" stroke="#a78bfa" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle cx="1090" cy="40" r="108" fill="none" stroke="#60a5fa" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="4 9"/>
    <path d="M840 0L1040 330M900 0L1100 330M960 0L1160 330" stroke="#8b9ac7" stroke-opacity="0.07"/>
    <rect x="54" y="42" width="215" height="30" rx="15" fill="#17243a" stroke="#33445f"/>
    <circle cx="72" cy="57" r="4" fill="#5eead4"/>
    <text x="86" y="62" fill="#bdc8dc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.3">PROFILE / AAYUSH.SHARMA</text>
    <text x="52" y="143" fill="#f4f7ff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="53" font-weight="750" letter-spacing="-1.8">Aayush Sharma</text>
    <rect x="54" y="165" width="65" height="4" rx="2" fill="url(#accent)"/>
    <text x="54" y="201" fill="#c9d4e8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Backend Python Developer</text>
    <text x="54" y="232" fill="#99a8c5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17">AI systems  ·  Retrieval  ·  Open source</text>
    <g transform="translate(54 270)">
      <rect width="104" height="28" rx="7" fill="#16263a" stroke="#31516a"/>
      <text x="52" y="18" text-anchor="middle" fill="#8be9dd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">PYTHON</text>
      <rect x="114" width="112" height="28" rx="7" fill="#1a203c" stroke="#3e4776"/>
      <text x="170" y="18" text-anchor="middle" fill="#a8b9ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">BACKEND</text>
      <rect x="236" width="85" height="28" rx="7" fill="#241d3d" stroke="#57417b"/>
      <text x="278.5" y="18" text-anchor="middle" fill="#d0b5ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">LLMs / RAG</text>
    </g>
    <!-- Terminal-inspired visual anchor -->
    <g transform="translate(775 72)">
      <rect x="0" y="0" width="358" height="190" rx="16" fill="#0a0f1d" fill-opacity="0.92" stroke="#3c4968" stroke-width="1.2"/>
      <path d="M0 42H358" stroke="#2a3550"/>
      <circle cx="20" cy="21" r="4" fill="#fb7185"/><circle cx="36" cy="21" r="4" fill="#fbbf24"/><circle cx="52" cy="21" r="4" fill="#5eead4"/>
      <text x="78" y="25" fill="#7383a7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">workspace / main.py</text>
      <text x="24" y="76" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">&gt; build()</text>
      <text x="24" y="104" fill="#b5c1d8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">design  -&gt;  implement</text>
      <text x="24" y="128" fill="#b5c1d8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">measure -&gt; improve</text>
      <text x="24" y="160" fill="#93a2bd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">status: </text>
      <rect x="77" y="148" width="75" height="20" rx="5" fill="#12342f" stroke="#28635a"/>
      <text x="114.5" y="162" text-anchor="middle" fill="#7ee8d2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">learning</text>
      <rect x="169" y="148" width="106" height="20" rx="5" fill="#262144" stroke="#51417e"/>
      <text x="222" y="162" text-anchor="middle" fill="#c5b5ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">shipping projects</text>
    </g>
    <text x="1140" y="302" text-anchor="end" fill="#64718e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2">B.TECH CSE  /  2027</text>
    <rect x="0" y="326" width="1200" height="4" fill="url(#accent)"/>
  </g>
</svg>
