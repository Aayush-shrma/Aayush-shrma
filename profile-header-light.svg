      <rect x="114" width="112" height="28" rx="7" fill="#edf1ff" stroke="#c4d0fa"/><text x="170" y="18" text-anchor="middle" fill="#3555b4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">BACKEND</text>
