    <text x="52" y="143" fill="#111b31" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="53" font-weight="750" letter-spacing="-1.8">Aayush Sharma</text>
