    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#53698f" stroke-opacity="0.10" stroke-width="1"/></pattern>
    <clipPath id="clip"><rect width="1200" height="330" rx="24"/></clipPath>
  </defs>
