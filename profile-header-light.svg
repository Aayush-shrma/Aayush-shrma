<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Aayush Sharma — Backend Python Developer and AI systems builder</title>
  <desc id="desc">Light banner: soft blue gradient, faint grid, teal-to-violet accent, and a terminal panel reading whoami and status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.62" stop-color="#eff5ff"/>
      <stop offset="1" stop-color="#f5f0ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="0.52" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#53698f" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="330" rx="24"/></clipPath>
    <clipPath id="bar"><rect x="0" y="326" width="1200" height="4"/></clipPath>
    <style>
      .dot{animation:pulse 2.6s ease-in-out infinite}
      .caret{animation:blink 1.1s steps(1,end) infinite}
      .rule{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.22,1,.36,1) both}
      .orb{animation:drift 16s ease-in-out infinite alternate}
      .shim{animation:shim 7s linear infinite}
      @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes grow{from{transform:scaleX(.15)}to{transform:scaleX(1)}}
      @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-24px,16px)}}
      @keyframes shim{from{transform:translateX(0)}to{transform:translateX(1520px)}}
      @media (prefers-reduced-motion:reduce){.dot,.caret,.rule,.orb,.shim{animation:none}}
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <rect width="1200" height="330" fill="url(#grid)"/>
    <circle class="orb" cx="1060" cy="-20" r="240" fill="url(#orb)"/>
    <circle cx="1090" cy="40" r="140" fill="none" stroke="#7c3aed" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="1090" cy="40" r="108" fill="none" stroke="#2563eb" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="4 9"/>
    <path d="M840 0L1040 330M900 0L1100 330M960 0L1160 330" stroke="#53698f" stroke-opacity="0.07"/>

    <!-- identity -->
    <rect x="54" y="42" width="215" height="30" rx="15" fill="#e7effb" stroke="#c7d6ec"/>
    <circle class="dot" cx="72" cy="57" r="4" fill="#0d9488"/>
    <text x="86" y="62" fill="#465975" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.3">PROFILE / AAYUSH.SHARMA</text>

    <text x="52" y="146" fill="#111b31" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="56" font-weight="750" letter-spacing="-1.9">Aayush Sharma</text>
    <rect class="rule" x="54" y="166" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="54" y="204" fill="#243753" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Backend Python Developer</text>
    <text x="54" y="235" fill="#536783" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17">AI systems  ·  Retrieval  ·  Open source</text>

    <g transform="translate(54 272)">
      <rect width="104" height="28" rx="7" fill="#e5f7f4" stroke="#addfd7"/>
      <text x="52" y="18" text-anchor="middle" fill="#087f74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">PYTHON</text>
      <rect x="114" width="112" height="28" rx="7" fill="#edf1ff" stroke="#c4d0fa"/>
      <text x="170" y="18" text-anchor="middle" fill="#3555b4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">BACKEND</text>
      <rect x="236" width="85" height="28" rx="7" fill="#f2ebff" stroke="#d7c5fa"/>
      <text x="278.5" y="18" text-anchor="middle" fill="#7041b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">LLMs / RAG</text>
    </g>

    <!-- terminal -->
    <g transform="translate(775 72)">
      <rect width="358" height="190" rx="16" fill="#ffffff" fill-opacity="0.9" stroke="#c8d4e8" stroke-width="1.2"/>
      <path d="M0 42H358" stroke="#d9e2f0"/>
      <circle cx="20" cy="21" r="4" fill="#fb7185"/><circle cx="36" cy="21" r="4" fill="#fbbf24"/><circle cx="52" cy="21" r="4" fill="#0d9488"/>
      <text x="78" y="25" fill="#7586a1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">workspace / build.py</text>
      <text x="24" y="78" fill="#087f74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">&gt; whoami</text>
      <rect class="caret" x="100" y="64" width="8" height="16" fill="#0d9488"/>
      <text x="24" y="106" fill="#34445f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">backend  ·  ai systems</text>
      <text x="24" y="140" fill="#087f74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">&gt; status</text>
      <rect x="24" y="152" width="150" height="20" rx="5" fill="#e1f7f2" stroke="#b4e6dc"/>
      <text x="99" y="166" text-anchor="middle" fill="#087f74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">shipping daily-log</text>
      <rect x="182" y="152" width="112" height="20" rx="5" fill="#efe8ff" stroke="#dac8fb"/>
      <text x="238" y="166" text-anchor="middle" fill="#7041b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">open source</text>
    </g>

    <text x="1140" y="302" text-anchor="end" fill="#7e8da4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2">B.TECH CSE  /  2027</text>

    <g clip-path="url(#bar)">
      <rect x="0" y="326" width="1200" height="4" fill="url(#accent)"/>
      <rect class="shim" x="-260" y="326" width="260" height="4" fill="#ffffff" opacity="0.65"/>
    </g>
  </g>
</svg>
