    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d9488"/><stop offset="0.52" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
