    <circle cx="1090" cy="40" r="140" fill="none" stroke="#7c3aed" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="1090" cy="40" r="108" fill="none" stroke="#2563eb" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="4 9"/>
