      <rect x="169" y="148" width="106" height="20" rx="5" fill="#efe8ff" stroke="#dac8fb"/><text x="222" y="162" text-anchor="middle" fill="#7041b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">shipping projects</text>
