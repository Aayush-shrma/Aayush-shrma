name: Greet newcomers

# Says hello the first time someone opens an issue (e.g. the guestbook) or a PR.
# Uses only the automatic GITHUB_TOKEN, and never checks out repository code.

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Welcome a first-time contributor
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for signing the guestbook, @${{ github.actor }} — genuinely made my day. 🙌
          pr-message: |
            Thanks for the pull request, @${{ github.actor }}! I'll take a look shortly.
